name: Build NobiStream 2 debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: secrets must NOT be used in a step-level `if:` condition.
      # GitHub rejects `if: ${{ secrets.X }}` with "Unrecognized
      # named-value: 'secrets'" and invalidates the whole workflow.
      # The guard lives in bash instead; secrets are mapped via env:.
      - name: Decode keystore
        env:
          NOBISTREAM2_KEYSTORE_B64: ${{ secrets.NOBISTREAM2_KEYSTORE_B64 }}
          NOBISTREAM2_KEYSTORE_PASSWORD: ${{ secrets.NOBISTREAM2_KEYSTORE_PASSWORD }}
          NOBISTREAM2_KEY_ALIAS: ${{ secrets.NOBISTREAM2_KEY_ALIAS }}
          NOBISTREAM2_KEY_PASSWORD: ${{ secrets.NOBISTREAM2_KEY_PASSWORD }}
        run: |
          if [ -n "$NOBISTREAM2_KEYSTORE_B64" ]; then
            echo "$NOBISTREAM2_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nobistream2.p12"
            echo "NOBISTREAM2_KEYSTORE_FILE=$RUNNER_TEMP/nobistream2.p12" >> "$GITHUB_ENV"
            echo "NOBISTREAM2_KEYSTORE_PASSWORD=$NOBISTREAM2_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOBISTREAM2_KEY_ALIAS=$NOBISTREAM2_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOBISTREAM2_KEY_PASSWORD=$NOBISTREAM2_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore decoded (signed build)."
          else
            echo "No keystore secret set; building with the default debug key."
          fi

      # Files pushed via the GitHub API lose their executable bit, so
      # gradlew arrives as 0644 and fails with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          NOBISTREAM2_API_ID: ${{ secrets.NOBISTREAM2_API_ID }}
          NOBISTREAM2_API_HASH: ${{ secrets.NOBISTREAM2_API_HASH }}
        run: ./gradlew assembleDebug --stacktrace

      - name: SHA-256 of APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nobistream2-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
